[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "price-tracker"
version = "0.1.0"
description = "A Playwright-based product price tracker with Discord alerts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kyle Murphy" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = [
    "playwright",
    "aiohttp",
]

[project.scripts]
price-tracker = "tracker.price_tracker:_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["tracker*"]
